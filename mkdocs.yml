site_name: cppyy_kit
site_description: >-
  Use Python to call C++ robotics libraries through cppyy's JIT. Compile the
  application ahead of time if needed.
site_url: https://awesomebytes.github.io/cppyy_kit/
repo_url: https://github.com/awesomebytes/cppyy_kit
repo_name: awesomebytes/cppyy_kit
edit_uri: ""

# The site source mirrors the repository through symlinks (see mkdocs_site_links.sh).
# The read-only kit and docs files use relative links based on the repository layout,
# where kit directories are siblings of docs/. The docs directory mirrors that layout.
# We symlink the Markdown files in the navigation, not whole kit directories,
# so the site does not include Python files, demos, or tests.
docs_dir: mkdocs_site
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      # Material's built-in Mermaid support: ```mermaid blocks render as diagrams
      # (used in the tutorials + several kit REPORTs).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# The strict docs build runs `mkdocs build --strict`. Broken links from the earlier
# docs layout have been fixed, so `links.not_found` is set to `warn` and fails under
# `--strict`. `unrecognized_links` stays `info` for source directories or assets that
# are not rendered as documentation pages.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: info
    absolute_links: info
    unrecognized_links: info

nav:
