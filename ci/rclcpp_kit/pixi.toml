[workspace]
authors = ["Sam Pfeiffer <sammypfeiffer@gmail.com>"]
name = "cppyy_kit_rclcpp_ci"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

# Keep this workspace deliberately small. The repository workspace contains
# every domain kit and cannot be solved on ARM64 until all third-party packages
# support that architecture. This environment proves the shared cppyy_kit and
# rclcpp_kit foundations on both native Linux architectures.
[dependencies]
ros-jazzy-ros-base = ">=0.11"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
cmake = "*"
ninja = "*"
make = "*"
compilers = "*"
pkg-config = "*"
python = "3.12.*"
pytest = ">=7.4,<8"
numpy = "*"
pydantic = ">=2,<3"
setuptools = "<81"
psutil = ">=7.2.2,<8"

# cppyy 3.5 has a top-level conda package on x86-64. ARM64 source tests retain
# the exact small upstream Python shim while resolving every compiled component
# from conda-forge. The package-proof lane separately builds and installs the
# top-level ARM64 conda bridge from the same source and component versions.
[target.linux-64.dependencies]
cppyy = ">=3.5,<4"

[target.linux-aarch64.dependencies]
cpycppyy = "==1.13.0"
cppyy-backend = "==1.15.3"
cppyy-cling = "==6.32.8"

[target.linux-aarch64.pypi-dependencies]
cppyy = "==3.5.0"

# Install the pure-Python cppyy shim against the conda-forge components above.
# Its isolated sdist build resolves cppyy-backend/Cling from PyPI and attempts
# an unsupported cppyy-cling 6.30.0 source build on a clean ARM environment.
[pypi-options]
no-build-isolation = ["cppyy"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
PYTHONPATH = "$PIXI_PROJECT_ROOT/../..:$PIXI_PROJECT_ROOT/../../rclcpp_kit:$PIXI_PROJECT_ROOT/../../bt_kit"

[tasks]
test-rclcpp = "pytest ../../rclcpp_kit/tests -v -ra"
test-cppyy = "pytest ../../cppyy_kit/tests -v -ra"
test-rclcpp-ci = "pytest ../../rclcpp_kit/tests -v -ra --junitxml=../../build/test-results/rclcpp-kit.xml"
test-cppyy-ci = "pytest ../../cppyy_kit/tests -v -ra --junitxml=../../build/test-results/cppyy-kit.xml"
