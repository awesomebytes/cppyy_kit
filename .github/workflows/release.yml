name: Release

# On a version tag (v*): build all 11 cppyy_kit-suite conda packages plus the
# architecture-scoped cppyy 3.5.0 ARM64 bridge, prove each from an isolated
# channel, then upload them to the prefix.dev channel `awesomebytes`.
#
# A prior OIDC upload from this repository succeeded. The 0.4.0 workflow is
# untested; if upload fails, check prefix.dev authorization for this repo and
# workflow (`awesomebytes/cppyy_kit`, `release.yml`).
#
# Authentication: OIDC trusted publishing (no API token stored). `id-token:
# write` lets the job mint the GitHub OIDC token that `rattler-build upload
# prefix` exchanges automatically.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: source preflight (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      MAKE_NPROCS: "2"
      STDCXX: "17"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify tag and runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up core source-test environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          working-directory: ci/rclcpp_kit
          cache: true
          cache-key: release-preflight-${{ matrix.platform }}-
          cache-write: false

      - name: Run core source contracts
        working-directory: ci/rclcpp_kit
        env:
          CPPYY_KIT_NATIVE_SAFETY_EVIDENCE: ${{ github.workspace }}/build/test-results/native-safety-${{ matrix.platform }}.json
        run: |
          mkdir -p ../../build/test-results
          pixi run test-cppyy-ci
          pixi run test-rclcpp-ci

      - name: Prove generated native glue with sanitizers
        working-directory: ci/rclcpp_kit
        run: >-
          pixi run bash ../../scripts/ci/prove_native_safety_sanitizers.sh
          ../../build/release-sanitizers-${{ matrix.platform }}
          ../../build/test-results

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-release-preflight-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/test-results
          if-no-files-found: error
          retention-days: 90

  build:
    name: build and prove all artifacts
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify tag matches all release metadata
        run: python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          # Only the packaging env (rattler-build); it pulls no ROS/cppyy stack.
          environments: pkg

      # Builds the 11 packages in dependency order into ./output, chaining the
      # local output as a file:// channel. rattler-build also runs each recipe's
      # fresh-env import test during the build.
      - name: Build all packages (dependency-ordered)
        run: pixi run -e pkg pkg-build-all

      # For each artifact, a temporary pixi workspace with
      # [file://output, robostack-jazzy, conda-forge] and only that package must
      # import cleanly (including cppdef for cppyy-kit and bringup for
      # rclcpp-kit). The repository must not be on PYTHONPATH.
      - name: Prove artifacts install + import from the channel
        run: |
          set -o pipefail
          mkdir -p build/release
          pixi run -e pkg pkg-prove 2>&1 | tee build/release/package-proof.log

      - name: Record artifact checksums
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find output -type f -name '*.conda' | sort)
          test "${#artifacts[@]}" -eq 11
          sha256sum "${artifacts[@]}" | tee build/release/SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: output/**/*.conda

      - name: Preserve portable provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            build/release/provenance.sigstore.json

      - name: Preserve packages and raw gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            output/**/*.conda
            build/release
          if-no-files-found: error
          retention-days: 90

  cppyy-arm:
    name: build and prove cppyy ARM64 bridge
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify tag and native runner
        run: |
          test "$(uname -m)" = "aarch64"
          python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up reproducible package builder
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          working-directory: ci/package
          cache: true
          cache-key: release-cppyy-arm-
          cache-write: false

      - name: Build, install, import, and exercise cppdef
        run: |
          set -euo pipefail
          mkdir -p output build/release-cppyy-arm
          pixi run --locked -m ci/package/pixi.toml \
            bash recipe/build_cppyy_arm.sh output 2>&1 \
            | tee build/release-cppyy-arm/package-build.log
          mapfile -t artifacts < <(
            find output/linux-aarch64 -type f \
              -name 'cppyy-3.5.0-py312*.conda' | sort
          )
          test "${#artifacts[@]}" -eq 1
          sha256sum "${artifacts[@]}" \
            output/cppyy-arm-package-proof.json \
            output/cppyy-arm-runtime-proof.log \
            | tee build/release-cppyy-arm/SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: output/linux-aarch64/cppyy-3.5.0-py312*.conda

      - name: Preserve portable provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            build/release-cppyy-arm/provenance.sigstore.json

      - name: Preserve bridge package and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cppyy-arm-package
          path: |
            output/linux-aarch64/cppyy-3.5.0-py312*.conda
            output/cppyy-arm-package-proof.json
            output/cppyy-arm-runtime-proof.log
            build/release-cppyy-arm
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: attest SBOM (${{ matrix.name }})
    needs: [build, cppyy-arm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cppyy
            version: "3.5.0"
            platform: linux-aarch64
            build: py312h7e7ac48_2
            dependencies: >-
              python cpycppyy cppyy-backend cppyy-cling libstdcxx libgcc
              python_abi
          - name: cppyy-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy numpy
          - name: ros-jazzy-bt-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy-kit ros-jazzy-behaviortree-cpp
          - name: ros-jazzy-control-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: >-
              python cppyy-kit ros-jazzy-rclcpp-kit ros-jazzy-ros2-control
          - name: ros-jazzy-cv-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy-kit opencv
          - name: ros-jazzy-dbow-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy-kit ros-jazzy-cv-kit opencv
          - name: ros-jazzy-moveit-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: >-
              python cppyy-kit ros-jazzy-rclcpp-kit ros-jazzy-moveit
              ros-jazzy-ament-index-python
          - name: ros-jazzy-nav2-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: >-
              python cppyy-kit ros-jazzy-rclcpp-kit
              ros-jazzy-nav2-costmap-2d ros-jazzy-nav2-navfn-planner
              ros-jazzy-nav2-smac-planner
              ros-jazzy-nav2-regulated-pure-pursuit-controller
              ros-jazzy-nav2-msgs
          - name: ros-jazzy-ompl-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy-kit ros-jazzy-ompl
          - name: ros-jazzy-pcl-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: >-
              python cppyy-kit ros-jazzy-rclcpp-kit pcl
              ros-jazzy-pcl-conversions
          - name: ros-jazzy-rclcpp-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: >-
              python cppyy-kit ros-jazzy-rclcpp ros-jazzy-rclcpp-action
              ros-jazzy-rclcpp-components ros-jazzy-rclcpp-lifecycle
              ros-jazzy-rclpy ros-jazzy-action-msgs
              ros-jazzy-composition-interfaces ros-jazzy-lifecycle-msgs
              ros-jazzy-ament-index-python
          - name: wbc-kit
            version: "0.4.0"
            platform: noarch
            build: pyh4616a5c_0
            dependencies: python cppyy-kit crocoddyl
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download proven packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-packages
          path: release-input

      - name: Download proven ARM64 bridge
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-cppyy-arm-package
          path: release-input

      - name: Identify package artifact
        id: artifact
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = "cppyy" ]; then
            mapfile -t artifacts < <(
              find release-input -type f -name 'cppyy-[0-9]*.conda' | sort
            )
          else
            mapfile -t artifacts < <(
              find release-input -type f -name "${PACKAGE}-*.conda" | sort
            )
          fi
          test "${#artifacts[@]}" -eq 1
          printf 'path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate package SPDX SBOM
        env:
          EXPECTED_DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          set -euo pipefail
          dependency_arguments=()
          for dependency in $EXPECTED_DEPENDENCIES; do
            dependency_arguments+=(--expect-dependency-name "$dependency")
          done
          python3 scripts/ci/generate_conda_spdx.py \
            --artifact "${{ steps.artifact.outputs.path }}" \
            --output "${{ matrix.name }}.spdx.json" \
            --expect-name "${{ matrix.name }}" \
            --expect-version "${{ matrix.version }}" \
            --expect-platform "${{ matrix.platform }}" \
            --expect-build "${{ matrix.build }}" \
            --exact-dependency-names \
            "${dependency_arguments[@]}"

      - name: Attest package SBOM
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}
          sbom-path: ${{ matrix.name }}.spdx.json

      - name: Preserve portable SBOM attestation bundle
        run: |
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "${{ matrix.name }}.sbom.sigstore.json"

      - name: Preserve package SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.spdx.json
            ${{ matrix.name }}.sbom.sigstore.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: upload proven and attested artifacts
    needs: [build, cppyy-arm, sbom]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          environments: pkg

      - name: Download proven packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-packages
          path: release-input

      - name: Download proven ARM64 bridge
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-cppyy-arm-package
          path: release-input

      - name: Compare local artifacts with existing channel bytes
        run: |
          set -euo pipefail
          mkdir -p build/release-upload
          mapfile -t artifacts < <(
            find release-input -type f -name '*.conda' | sort
          )
          test "${#artifacts[@]}" -eq 12
          python3 scripts/ci/verify_prefix_upload.py \
            --output build/release-upload/preflight.json \
            --missing-output build/release-upload/missing.txt \
            "${artifacts[@]}"

      # Upload only identities proven absent. Existing identities are accepted
      # only when their downloaded bytes match the locally attested artifact.
      - name: Upload absent artifacts to prefix.dev (OIDC)
        run: |
          set -euo pipefail
          mapfile -t artifacts < build/release-upload/missing.txt
          if [ "${#artifacts[@]}" -gt 0 ]; then
            pixi run -e pkg rattler-build upload prefix \
              --channel awesomebytes "${artifacts[@]}"
          else
            echo "All artifact identities already contain the exact release bytes"
          fi

      - name: Verify published channel bytes
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            find release-input -type f -name '*.conda' | sort
          )
          python3 scripts/ci/verify_prefix_upload.py \
            --require-present --attempts 12 --delay-seconds 5 \
            --output build/release-upload/postflight.json \
            "${artifacts[@]}"

      - name: Preserve upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-upload-verification-${{ github.ref_name }}
          path: build/release-upload
          if-no-files-found: error
          retention-days: 90
