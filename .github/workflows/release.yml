name: Release

# On a version tag (v*): build all 11 cppyy_kit-suite conda packages plus the
# architecture-scoped cppyy 3.5.0 ARM64 bridge, prove each from an isolated
# channel, then upload them to the prefix.dev channel `awesomebytes`.
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │ ⚠  MANUAL STEP REQUIRED BEFORE THE FIRST RELEASE — Sam, action needed:       │
# │                                                                              │
# │ The UPLOAD step will FAIL until the cppyy_kit repo is authorized on          │
# │ prefix.dev. OIDC trusted publishing is scoped per repo+workflow, and the     │
# │ existing rclcppyy authorization does NOT cover this repo. Add it at:         │
# │   prefix.dev → channel `awesomebytes` → Settings → Repository Access →       │
# │   authorize  awesomebytes/cppyy_kit , workflow  release.yml , read/write.    │
# │                                                                              │
# │ The build + artifact-proof steps run and gate regardless, so a tag pushed    │
# │ before authorization still validates all 12 packages; only the upload 401s.  │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Authentication: OIDC trusted publishing (no API token stored). `id-token:
# write` lets the job mint the GitHub OIDC token that `rattler-build upload
# prefix` exchanges automatically.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: source preflight (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      MAKE_NPROCS: "2"
      STDCXX: "17"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@v5

      - name: Verify tag and runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up core source-test environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          working-directory: ci/rclcpp_kit
          cache: true
          cache-key: release-preflight-${{ matrix.platform }}-
          cache-write: false

      - name: Run core source contracts
        working-directory: ci/rclcpp_kit
        env:
          CPPYY_KIT_NATIVE_SAFETY_EVIDENCE: ${{ github.workspace }}/build/test-results/native-safety-${{ matrix.platform }}.json
        run: |
          mkdir -p ../../build/test-results
          pixi run test-cppyy-ci
          pixi run test-rclcpp-ci

      - name: Prove generated native glue with sanitizers
        working-directory: ci/rclcpp_kit
        run: >-
          pixi run bash ../../scripts/ci/prove_native_safety_sanitizers.sh
          ../../build/release-sanitizers-${{ matrix.platform }}
          ../../build/test-results

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-release-preflight-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/test-results
          if-no-files-found: error
          retention-days: 90

  build:
    name: build and prove all artifacts
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches all release metadata
        run: python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          # Only the packaging env (rattler-build); it pulls no ROS/cppyy stack.
          environments: pkg

      # Builds the 11 packages in dependency order into ./output, chaining the
      # local output as a file:// channel. rattler-build also runs each recipe's
      # fresh-env import test during the build.
      - name: Build all packages (dependency-ordered)
        run: pixi run -e pkg pkg-build-all

      # The release discipline: for each artifact, a throwaway pixi workspace
      # with [file://output, robostack-jazzy, conda-forge] and the single package
      # as its only dep must import cleanly (+ cppdef for cppyy-kit, bringup for
      # rclcpp-kit) — no repo on PYTHONPATH.
      - name: Prove artifacts install + import from the channel
        run: |
          set -o pipefail
          mkdir -p build/release
          pixi run -e pkg pkg-prove 2>&1 | tee build/release/package-proof.log

      - name: Record artifact checksums
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find output -type f -name '*.conda' | sort)
          test "${#artifacts[@]}" -eq 11
          sha256sum "${artifacts[@]}" | tee build/release/SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: output/**/*.conda

      - name: Preserve portable provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            build/release/provenance.sigstore.json

      - name: Preserve packages and raw gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            output/**/*.conda
            build/release
          if-no-files-found: error
          retention-days: 90

  cppyy-arm:
    name: build and prove cppyy ARM64 bridge
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@v5

      - name: Verify tag and native runner
        run: |
          test "$(uname -m)" = "aarch64"
          python3 scripts/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up reproducible package builder
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          working-directory: ci/package
          cache: true
          cache-key: release-cppyy-arm-
          cache-write: false

      - name: Build, install, import, and exercise cppdef
        run: |
          set -euo pipefail
          mkdir -p output build/release-cppyy-arm
          pixi run --locked -m ci/package/pixi.toml \
            bash recipe/build_cppyy_arm.sh output 2>&1 \
            | tee build/release-cppyy-arm/package-build.log
          mapfile -t artifacts < <(
            find output/linux-aarch64 -type f \
              -name 'cppyy-3.5.0-py312*.conda' | sort
          )
          test "${#artifacts[@]}" -eq 1
          sha256sum "${artifacts[@]}" \
            output/cppyy-arm-package-proof.json \
            output/cppyy-arm-runtime-proof.log \
            | tee build/release-cppyy-arm/SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: output/linux-aarch64/cppyy-3.5.0-py312*.conda

      - name: Preserve portable provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            build/release-cppyy-arm/provenance.sigstore.json

      - name: Preserve bridge package and proof
        uses: actions/upload-artifact@v4
        with:
          name: release-cppyy-arm-package
          path: |
            output/linux-aarch64/cppyy-3.5.0-py312*.conda
            output/cppyy-arm-package-proof.json
            output/cppyy-arm-runtime-proof.log
            build/release-cppyy-arm
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: attest SBOM (${{ matrix.package }})
    needs: [build, cppyy-arm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - cppyy
          - cppyy-kit
          - ros-jazzy-bt-kit
          - ros-jazzy-control-kit
          - ros-jazzy-cv-kit
          - ros-jazzy-dbow-kit
          - ros-jazzy-moveit-kit
          - ros-jazzy-nav2-kit
          - ros-jazzy-ompl-kit
          - ros-jazzy-pcl-kit
          - ros-jazzy-rclcpp-kit
          - wbc-kit
    steps:
      - name: Download proven packages
        uses: actions/download-artifact@v5
        with:
          name: release-packages
          path: release-input

      - name: Download proven ARM64 bridge
        uses: actions/download-artifact@v5
        with:
          name: release-cppyy-arm-package
          path: release-input

      - name: Identify package artifact
        id: artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = "cppyy" ]; then
            mapfile -t artifacts < <(
              find release-input -type f -name 'cppyy-[0-9]*.conda' | sort
            )
          else
            mapfile -t artifacts < <(
              find release-input -type f -name "${PACKAGE}-*.conda" | sort
            )
          fi
          test "${#artifacts[@]}" -eq 1
          printf 'path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate package SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ${{ steps.artifact.outputs.path }}
          format: spdx-json
          output-file: ${{ matrix.package }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest package SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}
          sbom-path: ${{ matrix.package }}.spdx.json

      - name: Preserve portable SBOM attestation bundle
        run: |
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "${{ matrix.package }}.sbom.sigstore.json"

      - name: Preserve package SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.package }}
          path: |
            ${{ matrix.package }}.spdx.json
            ${{ matrix.package }}.sbom.sigstore.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: upload proven and attested artifacts
    needs: [build, cppyy-arm, sbom]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          environments: pkg

      - name: Download proven packages
        uses: actions/download-artifact@v5
        with:
          name: release-packages
          path: release-input

      - name: Download proven ARM64 bridge
        uses: actions/download-artifact@v5
        with:
          name: release-cppyy-arm-package
          path: release-input

      # Upload every built .conda to the prefix.dev channel `awesomebytes` via
      # OIDC. REQUIRES the Repository Access authorization flagged in the header.
      - name: Upload to prefix.dev channel `awesomebytes` (OIDC)
        run: |
          set -euxo pipefail
          pixi run -e pkg rattler-build upload prefix --skip-existing \
            --channel awesomebytes \
            $(find release-input -name '*.conda' | sort)
