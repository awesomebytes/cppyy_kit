name: Docs

# On push to main, build the MkDocs site in strict mode and deploy it to GitHub
# Pages. The deploy job may fail until Pages is enabled for the repository.
#
# Manual setup: if the API call in M4 could not enable Pages, go to repository
# Settings > Pages > Build and deployment and select "GitHub Actions". Until then,
# the build job still runs and the deploy job can fail without blocking the workflow.

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deployment; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          # Docs env only (mkdocs-material); no ROS/cppyy stack.
          environments: docs
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build site (strict)
        run: pixi run -e docs docs-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: deploy to Pages (best-effort until enabled)
    needs: build
    runs-on: ubuntu-latest
    # Allow deploy failures until Pages is enabled. The build job still gates.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
