name: CI

# A clean checkout must lint clean and collect the full kit test suite (which
# auto-skips per kit in the default env), with no manual steps beyond `pixi run`.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + default test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Pin pixi to the version that generated and validated pixi.lock
          # locally, so CI resolves the same environment.
          pixi-version: v0.70.0
          # Default environment only. The kit feature envs pull multi-GB C++
          # extras (moveit / nav2 / pcl / opencv ...) that the default lint +
          # skip-collection suite below does not need.
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # flake8 over every kit package + shared scripts (see .flake8).
      - name: Lint
        run: pixi run lint

      # Collects every kit test suite; each auto-skips on its capability probe in
      # the default env (no kit C++ libs). Green = everything imports & skips
      # cleanly. The per-kit green proof runs in the feature envs (test-<kit>).
      - name: Test (kit suites collect + auto-skip)
        run: pixi run test

  rclcpp-kit:
    name: rclcpp-kit (${{ matrix.platform }})
    env:
      # Limit the ARM64 cppyy/Cling source build to avoid exhausting the
      # standard runner while still compiling in parallel.
      MAKE_NPROCS: "2"
      STDCXX: "17"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
            package_proof: true
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
            package_proof: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          working-directory: ci/rclcpp_kit
          cache: true
          cache-key: rclcpp-kit-${{ matrix.platform }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore generated C++ caches
        id: generated-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cppyy_kit
          key: generated-cppyy-kit-${{ matrix.platform }}-${{ hashFiles('ci/rclcpp_kit/pixi.lock') }}

      - name: Record runtime architecture
        working-directory: ci/rclcpp_kit
        run: |
          mkdir -p ../../build/test-results
          uname -a | tee ../../build/test-results/runtime.txt
          pixi run python -c \
            'import cppyy, platform, sys; print(f"machine={platform.machine()} python={sys.version} cppyy={cppyy.__version__}")' \
            | tee -a ../../build/test-results/runtime.txt
          pixi list > ../../build/test-results/packages.txt

      - name: Test cppyy_kit
        working-directory: ci/rclcpp_kit
        run: pixi run test-cppyy-ci

      - name: Test rclcpp_kit
        working-directory: ci/rclcpp_kit
        run: pixi run test-rclcpp-ci

      - name: Build and prove installed core packages
        if: ${{ always() && matrix.package_proof }}
        run: |
          set -euo pipefail
          mkdir -p build/test-results build/package-channel
          pixi run -e pkg bash recipe/build_rclcpp.sh build/package-channel 2>&1 \
            | tee build/test-results/package-build.log
          find build/package-channel -name '*.conda' -print \
            | sort | tee build/test-results/package-artifacts.txt
          pixi run -e pkg bash recipe/prove_rclcpp.sh build/package-channel 2>&1 \
            | tee build/test-results/package-proof.txt

      - name: Record ARM64 package support boundary
        if: ${{ always() && !matrix.package_proof }}
        run: |
          mkdir -p build/test-results
          cat > build/test-results/package-proof.txt <<'EOF'
          NOT RUN: native source tests build cppyy 3.5.0 from its upstream source
          distribution. The package metadata correctly requires conda cppyy >=3.5,
          for which no Python 3.12 linux-aarch64 package currently exists. Source
          success does not claim that these conda artifacts install on ARM64.
          EOF

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclcpp-kit-${{ matrix.platform }}-test-evidence
          path: build/test-results
          if-no-files-found: error
          retention-days: 14

      - name: Save generated C++ caches
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.generated-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cppyy_kit
          key: generated-cppyy-kit-${{ matrix.platform }}-${{ hashFiles('ci/rclcpp_kit/pixi.lock') }}
