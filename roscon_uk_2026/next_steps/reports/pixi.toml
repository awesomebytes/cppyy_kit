[workspace]
name = "native-dataset-reports"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
cppyy = "3.5.*"
numpy = "2.*"
pydantic = "2.*"
mcap = "1.5.0.*"
ros-jazzy-mcap-vendor = "0.26.11.*"
cxx-compiler = "*"
gcc = "14.3.0.*"
gxx = "14.3.0.*"
libgcc = "15.2.0.*"
libstdcxx = "15.2.0.*"

[pypi-dependencies]
mcap-ros2-support = "==0.5.7"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/../../.."
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tasks]
check = "python -m unittest roscon_uk_2026.next_steps.reports.test_report -v"
integration = "python -m unittest roscon_uk_2026.next_steps.reports.test_integration -v"
