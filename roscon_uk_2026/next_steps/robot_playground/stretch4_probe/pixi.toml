[workspace]
name = "stretch4-feasibility-probe"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "==2.2.5"
pip = "*"
c-compiler = "*"
pkg-config = "*"
pillow = "*"
libegl = "*"
libgl = "*"
libopengl = "*"
evdev = "*"

[pypi-dependencies]
stretch4-mujoco = { path = "source", editable = true }

[tasks]
probe = "bash ../../simulator_guard.sh -- python probe.py"
viewer = "bash ../../simulator_guard.sh -- python viewer.py"
