<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam calibration target</title>
<style>
html,body{margin:0;background:white;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
svg{width:min(92vw,128.57vh);height:auto;display:block}
button{position:absolute;bottom:5px;font:16px sans-serif;background:white;border:1px solid #aaa;padding:8px}
</style>
<svg id="board" viewBox="-1 -1 11 8" xmlns="http://www.w3.org/2000/svg" aria-label="9 by 6 squares, 8 by 5 inner corners"><rect x="-1" y="-1" width="11" height="8" fill="white"/></svg>
<button id="fullscreen">Tap for fullscreen, then hold still at different angles</button>
<script>
const board=document.getElementById('board');
for(let y=0;y<6;y++) for(let x=0;x<9;x++) if((x+y)%2===0){
 const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
 for(const [k,v] of Object.entries({x,y,width:1,height:1,fill:'black'}))r.setAttribute(k,v);
 board.append(r);
}
document.getElementById('fullscreen').onclick=async()=>{
 try{await document.documentElement.requestFullscreen();}catch(e){}
 document.getElementById('fullscreen').style.display='none';
 try{await navigator.wakeLock.request('screen');}catch(e){}
};
</script>
