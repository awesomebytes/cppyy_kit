[workspace]
name = "webcam-depth-models"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
cppyy = "*"
gxx_linux-64 = "14.*"

[pypi-dependencies]
onnxruntime = "==1.23.2"
pupil-apriltags = "==1.0.4.post11"
lap = ">=0.5.12"
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
addict = "*"
marimo = "==0.25.2"
torch = ">=2.7,<2.10"
torchvision = ">=0.22,<0.25"
ultralytics = ">=8.3,<9"
numpy = ">=1.26,<2"
einops = "*"
omegaconf = "*"
safetensors = "*"
huggingface-hub = "*"
trimesh = "*"
imageio = "*"
evo = "*"
e3nn = "*"
moviepy = "==1.0.3"
plyfile = "*"
pillow-heif = "*"
pycolmap = "*"
open-clip-torch = "*"
ftfy = "*"
regex = "*"

[activation]
scripts = ["activate.sh"]

[tasks]
probe = "python probe.py"

[environments]
python312 = { features = [] }
