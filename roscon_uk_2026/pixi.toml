[workspace]
name = "cppyy-kit-roscon-uk-2026"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
# Current suite source is activated below. Version 0.4.0 is not yet published.
cppyy = ">=3.5,<4"
cxx-compiler = "*"
gcc = "==14.3.0"
gxx = "==14.3.0"
libgcc = "==15.2.0"
libstdcxx = "==15.2.0"
numpy = "*"
mcap = "*"
pytest = ">=7.4,<8"

[pypi-dependencies]
mcap-ros2-support = "==0.5.7"

[activation.env]
# Checkout-only rehearsal, including the source kit guides. No installed 0.3 kit
# package is used. Native dependencies and compiler activation come from Pixi.
PYTHONPATH = "$PIXI_PROJECT_ROOT/..:$PIXI_PROJECT_ROOT/../rclcpp_kit:$PIXI_PROJECT_ROOT/../control_kit:$PIXI_PROJECT_ROOT/../cv_kit:$PIXI_PROJECT_ROOT/../ompl_kit"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[tasks]
agent-guide = "python scripts/agent_guide.py"
fetch-data = "python scripts/fetch_data.py"
inspect-data = "python scripts/inspect_mcap.py"
check = "pytest tests -q"
check-acceptance = "python scripts/check_acceptance.py"
verify = "python scripts/verify.py"

[feature.ros.dependencies]
ros-jazzy-rclcpp = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
ros-jazzy-ros2bag = "*"
ros-jazzy-std-msgs = ">=5.3.8,<6"

[feature.control.dependencies]
ros-jazzy-ros2-control = "*"

[feature.vision.dependencies]
libopencv = "*"
py-opencv = "*"

[environments]
ros = { features = ["ros"], solve-group = "default" }
control = { features = ["ros", "control"], solve-group = "default" }
vision = { features = ["ros", "vision"], solve-group = "default" }
