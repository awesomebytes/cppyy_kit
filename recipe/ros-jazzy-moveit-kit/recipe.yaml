schema_version: 1

context:
  name: ros-jazzy-moveit-kit
  # Keep this version in sync across recipe/*/recipe.yaml (see recipe/README.md).
  version: "0.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Repo root (this recipe lives in recipe/ros-jazzy-moveit-kit/). use_gitignore skips
  # .pixi/, build/, output/. build.sh installs only the moveit_kit package.
  path: ../..
  use_gitignore: true

build:
  # Pure-Python (JITs C++ at runtime via cppyy, nothing compiled at build time)
  # -> noarch python: one artifact for every platform/python.
  noarch: python
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=61
  run:
    - python
    - cppyy-kit ==0.4.1
    - ros-jazzy-rclcpp-kit ==0.4.1
    - ros-jazzy-moveit
    - ros-jazzy-ament-index-python

tests:
  - script:
      # Fresh-env import smoke (rattler-build resolves run deps in an isolated
      # test env). The richer proof runs in the driver (recipe/prove_all.sh).
      - python -c "import moveit_kit; print('moveit_kit', moveit_kit.__file__)"

about:
  homepage: https://github.com/awesomebytes/cppyy_kit
  repository: https://github.com/awesomebytes/cppyy_kit
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Use the MoveIt 2 C++ API from Python through cppyy"
  description: |
    moveit_kit exposes the MoveIt 2 C++ API to Python through cppyy. It supports
    robot models, forward and inverse kinematics, collision checks, and the
    OMPL planning pipeline in one process.

extra:
  recipe-maintainers:
    - awesomebytes
