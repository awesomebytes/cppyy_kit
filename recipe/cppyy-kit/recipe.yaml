schema_version: 1

context:
  name: cppyy-kit
  # Suite version — keep in sync across recipe/*/recipe.yaml (see recipe/README.md).
  version: "0.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Repo root (this recipe lives in recipe/cppyy-kit/). use_gitignore skips
  # .pixi/, build/, output/. build.sh installs only the cppyy_kit package.
  path: ../..
  use_gitignore: true

build:
  # Pure-Python (JITs C++ at runtime via cppyy, nothing compiled at build time)
  # -> noarch python wrapper; package compatibility follows cppyy's runtime deps.
  noarch: python
  number: 2

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools >=61
  run:
    - python 3.12.*
    - cppyy >=3.5,<4

  # The x86_64 conda-forge Cling 6.32.8 package segfaults at interpreter
  # startup with the currently selected GCC/G++ 15.3 and libgcc/libstdcxx 16.2.
  # Pin to the pair verified by native import + cppdef on x86_64 and ARM64.
  run_constraints:
    - gcc ==14.3.0
    - gxx ==14.3.0
    - libgcc ==15.2.0
    - libstdcxx ==15.2.0

tests:
  - script:
      # Fresh-env import smoke (rattler-build resolves run deps in an isolated
      # test env). The richer proof runs in the driver (recipe/prove_all.sh).
      - python -c "import cppyy_kit; print('cppyy_kit', cppyy_kit.__file__)"
    requirements:
      run:
        - gcc ==14.3.0
        - gxx ==14.3.0

about:
  homepage: https://github.com/awesomebytes/cppyy_kit
  repository: https://github.com/awesomebytes/cppyy_kit
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "cppyy friction primitives + freeze/vendored-source tooling (ROS-free base)"
  description: |
    cppyy_kit is the ROS-free base of the cppyy_kit suite: the friction
    primitives shared by every kit (load / keep_alive / callback /
    HandleRegistry / warmup / first_use / teardown / probe) plus the freeze
    (Cling PCH + direct-compile + vendored-source) tooling. Everything else in
    the suite depends on it.

extra:
  recipe-maintainers:
    - awesomebytes
