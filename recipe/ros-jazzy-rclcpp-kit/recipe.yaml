schema_version: 1

context:
  name: ros-jazzy-rclcpp-kit
  # Keep this version in sync across recipe/*/recipe.yaml (see recipe/README.md).
  version: "0.3.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Repo root (this recipe lives in recipe/ros-jazzy-rclcpp-kit/). use_gitignore skips
  # .pixi/, build/, output/. build.sh installs only the rclcpp_kit package.
  path: ../..
  use_gitignore: true

build:
  # Pure-Python (JITs C++ at runtime via cppyy, nothing compiled at build time)
  # -> noarch python: one artifact for every platform/python.
  noarch: python
  number: 1

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools >=61
  run:
    - python 3.12.*
    - cppyy-kit ==0.3.0
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-rclcpp-components
    - ros-jazzy-rclcpp-lifecycle
    - ros-jazzy-rclpy
    - ros-jazzy-action-msgs
    - ros-jazzy-composition-interfaces
    - ros-jazzy-lifecycle-msgs
    - ros-jazzy-ament-index-python

tests:
  - script:
      # Fresh-env import smoke (rattler-build resolves run deps in an isolated
      # test env). The richer proof runs in the driver (recipe/prove_all.sh).
      - python -c "import importlib; from rclcpp_kit import borrowed_publish; native = importlib.import_module('rclcpp_kit.native'); pipeline = importlib.import_module('rclcpp_kit.native_pipeline'); client = importlib.import_module('rclcpp_kit.native_client'); action = importlib.import_module('rclcpp_kit.native_action'); component = importlib.import_module('rclcpp_kit.native_component'); lifecycle = importlib.import_module('rclcpp_kit.native_lifecycle'); print('borrowed_publish', borrowed_publish.__file__, 'native', native.__file__, 'native_pipeline', pipeline.__file__, 'native_client', client.__file__, 'native_action', action.__file__, 'native_component', component.__file__, 'native_lifecycle', lifecycle.__file__)"

about:
  homepage: https://github.com/awesomebytes/cppyy_kit
  repository: https://github.com/awesomebytes/cppyy_kit
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Use rclcpp and ROS 2 core features from Python through cppyy"
  description: |
    rclcpp_kit exposes ROS 2 core features to Python through cppyy. It supports
    rclcpp startup, C++ message conversion and serialization, rosbag2_cpp, tf,
    executors, nodes, native services and clients, action clients, component
    containers, and lifecycle nodes. Other ROS-based kits depend on it.

extra:
  recipe-maintainers:
    - awesomebytes
