schema_version: 1

context:
  name: ros-jazzy-dbow-kit
  # Keep this version in sync across recipe/*/recipe.yaml (see recipe/README.md).
  version: "0.4.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Repo root (this recipe lives in recipe/ros-jazzy-dbow-kit/). use_gitignore skips
  # .pixi/, build/, output/. build.sh installs only the dbow_kit package.
  path: ../..
  use_gitignore: true

build:
  # Pure-Python (JITs C++ at runtime via cppyy, nothing compiled at build time)
  # -> noarch python: one artifact for every platform/python.
  noarch: python
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=61
  run:
    - python
    - cppyy-kit ==0.4.0
    - ros-jazzy-cv-kit ==0.4.0
    - opencv >=4,<5

tests:
  - script:
      # Fresh-env import smoke (rattler-build resolves run deps in an isolated
      # test env). The richer proof runs in the driver (recipe/prove_all.sh).
      - python -c "import dbow_kit; print('dbow_kit', dbow_kit.__file__)"

about:
  homepage: https://github.com/awesomebytes/cppyy_kit
  repository: https://github.com/awesomebytes/cppyy_kit
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Use DBoW2 place recognition and loop closure from Python"
  description: |
    dbow_kit exposes DBoW2 (Bags of Binary Words) to Python through cppyy.
    DBoW2 has no Python binding and is not on conda-forge. The build step
    compiles the vendored source in dbow_kit/cpp/build_dbow2.py and creates the
    shared library used by this Python wrapper.

extra:
  recipe-maintainers:
    - awesomebytes
