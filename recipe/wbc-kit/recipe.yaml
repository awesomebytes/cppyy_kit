schema_version: 1

context:
  name: wbc-kit
  # Keep this version in sync across recipe/*/recipe.yaml (see recipe/README.md).
  version: "0.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Repo root (this recipe lives in recipe/wbc-kit/). use_gitignore skips
  # .pixi/, build/, output/. build.sh installs only the wbc_kit package.
  path: ../..
  use_gitignore: true

build:
  # Pure-Python (JITs C++ at runtime via cppyy, nothing compiled at build time)
  # -> noarch python: one artifact for every platform/python.
  noarch: python
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=61
  run:
    - python
    - cppyy-kit ==0.4.1
    - crocoddyl

tests:
  - script:
      # Fresh-env import smoke (rattler-build resolves run deps in an isolated
      # test env). The richer proof runs in the driver (recipe/prove_all.sh).
      - python -c "import wbc_kit; print('wbc_kit', wbc_kit.__file__)"

about:
  homepage: https://github.com/awesomebytes/cppyy_kit
  repository: https://github.com/awesomebytes/cppyy_kit
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Define Crocoddyl action models in C++ through cppyy (ROS-free)"
  description: |
    wbc_kit exposes Crocoddyl, an optimal-control library for whole-body and
    legged robots, to Python through cppyy. It supports defining custom C++
    ActionModelAbstract subclasses inline without a separate build system. This
    kit is ROS-free and depends on cppyy-kit and Crocoddyl. Crocoddyl brings in
    pinocchio as a dependency. It uses a separate environment because Crocoddyl
    and pinocchio require a different libboost version than Robostack.

extra:
  recipe-maintainers:
    - awesomebytes
