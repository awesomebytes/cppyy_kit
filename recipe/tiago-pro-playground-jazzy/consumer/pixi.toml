[workspace]
name = "tiago-pro-playground"
channels = ["https://prefix.dev/awesomebytes", "robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
tiago-pro-playground = "==0.2.0"

[tasks]
playground = "tiago-pro-playground"
playground-headless = "tiago-pro-playground gui:=false rviz:=false"

[feature.kit.dependencies]
ros-jazzy-rclcpp-kit = "==0.4.1"

[environments]
default = {features = [], solve-group = "jazzy"}
kit = {features = ["kit"], solve-group = "jazzy"}
